name: Aplicar patch

on:
  push:
    branches:
      - 'refactor/**'
    paths:
      - '*.patch'

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Detectar patch
        id: patch
        run: |
          ARCHIVO=$(ls *.patch | head -1)
          echo "archivo=$ARCHIVO" >> $GITHUB_OUTPUT
          echo "destino=refactor/${ARCHIVO%.patch}" >> $GITHUB_OUTPUT
          echo "Aplicando $ARCHIVO"

      - name: Aplicar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git am --keep-cr "${{ steps.patch.outputs.archivo }}" || git apply --3way "${{ steps.patch.outputs.archivo }}"
          git rm -f --ignore-unmatch *.patch .github/workflows/aplicar-patch.yml
          git commit -am "chore: limpiar patch aplicado" || true

      - name: Instalar y testear
        run: |
          npm install
          npm test

      - name: Push
        run: git push origin HEAD:${{ steps.patch.outputs.destino }}
