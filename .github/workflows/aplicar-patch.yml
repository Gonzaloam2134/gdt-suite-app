name: Fase 5

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/fase3-fix'

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ver qué hay
        run: ls -la

      - name: Aplicar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git am --keep-cr fase5.patch || git apply --3way fase5.patch
          git rm -f --ignore-unmatch fase5.patch .github/workflows/aplicar-patch.yml
          git commit -am "chore: limpiar patch aplicado" || true

      - name: Instalar y testear
        run: |
          npm install
          npm test

      - name: Push
        run: git push origin HEAD:refactor/fase5
