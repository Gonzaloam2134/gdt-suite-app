name: Aplicar patch
on: workflow_dispatch

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git am --keep-cr fase0-1.patch || git apply --3way fase0-1.patch
          git rm -f fase0-1.patch .github/workflows/aplicar-patch.yml
          git commit -am "refactor: fase 0 + 1" || true
      - name: Instalar y testear
        run: |
          npm install
          npm test
      - name: Push
        run: git push origin HEAD:refactor/fase-0-1
