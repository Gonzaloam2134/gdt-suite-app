name: Aplicar patch fase 0-1

on:
  push:
    branches:
      - codespace-solid-funicular-qv79977v6wpwhpp6

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el patch existe
        run: ls -la fase0-1.patch

      - name: Aplicar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git am --keep-cr fase0-1.patch || git apply --3way fase0-1.patch
          git rm -f --ignore-unmatch fase0-1.patch .github/workflows/aplicar-patch.yml
          git commit -am "refactor: fase 0 + 1" || true

      - name: Instalar y testear
        run: |
          npm install
          npm test

      - name: Push a rama nueva
        run: git push origin HEAD:refactor/fase-0-1
