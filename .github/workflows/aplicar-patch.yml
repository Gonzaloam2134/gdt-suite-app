name: Fase 3 fix

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/fase2'

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git am --keep-cr fase2-fix.patch || git apply --3way fase2-fix.patch
          git rm -f --ignore-unmatch fase2-fix.patch .github/workflows/aplicar-patch.yml
          git commit -am "chore: limpiar patch aplicado" || true
      - name: Instalar y testear
        run: |
          npm install
          npm test
      - name: Push
        run: git push origin HEAD:refactor/fase2-fix
